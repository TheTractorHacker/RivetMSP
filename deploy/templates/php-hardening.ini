; RivetMSP PHP-FPM hardening drop-in
;
; Consumed by: deploy/harden.sh (and deploy/install.sh, which calls it),
; copied verbatim to /etc/php/8.4/fpm/conf.d/99-itflow-hardening.ini and
; picked up on the next `systemctl reload php8.4-fpm`. The "99-" prefix loads
; it after every other conf.d file so nothing here gets silently overridden.

; Stop leaking the PHP version in the X-Powered-By response header and in
; phpinfo()-shaped fingerprinting.
expose_php = Off

; Disabled here: confirmed by grepping the entire codebase, including
; plugins/, for every call site of each name below (both the original seven
; and system/proc_open/passthru independently re-verified) - every one of
; these eleven has ZERO real call sites anywhere in the app or its vendored
; libraries (the handful of hits for system/proc_open/passthru are string
; literals inside setup/setup_functions.php's own list of dangerous
; function *names* it scans for, or a commented-out/doc-comment `assert(`
; in vendored HTMLPurifier.standalone.php) - not actual calls), so
; disabling all eleven cannot break a real feature.
;
; Deliberately NOT in this list: exec, shell_exec, popen. The app genuinely
; calls these for real features - git-based self-update
; (admin/post/update.php, admin/update.php, scripts/update_cli.php), backup
; creation (admin/post/backup.php), cron auxiliary work (cron/cron.php,
; admin/post/cron.php), and PHPMailer's sendmail transport (popen). Disabling
; any of these three breaks that feature outright with no obvious error
; message pointing back here - do not add them.
disable_functions = phpinfo,show_source,highlight_file,posix_kill,posix_mkfifo,putenv,create_function,system,proc_open,passthru,assert

; open_basedir is intentionally NOT set here. Doing it safely requires
; auditing every directory the app touches - uploads/, backups/, PHP's
; session save path, tmp paths, log paths, and the git working tree itself
; for self-update - and that audit hasn't been done. Getting it wrong
; silently breaks a feature (e.g. self-update failing to write, or a report
; export failing to write a tmp file) with a confusing error far from this
; file. Treat this as a follow-up requiring its own dedicated audit, not
; something to guess at here.

; Session cookie hardening. The app's own session bootstrap already sets
; cookie_httponly/cookie_secure at runtime for its own entry points, so
; these two are already effectively on for the app today - this sets them
; at the ini level too as defense-in-depth for any other PHP entry point
; that runs before/without that bootstrap. use_strict_mode is NOT set
; anywhere else in the app, so this is the only place it gets turned on.
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = Lax
session.use_strict_mode = On

; Already Off by default on any current PHP build; set explicitly so this
; stays true even if a future PHP default ever changes, and so the intent is
; documented in one place with everything else.
allow_url_include = Off

; Matches this app's own nginx vhost, which declares client_max_body_size
; 500M. 100M is a sane, documented middle ground rather than matching
; nginx's 500M exactly. A company with a genuine need for larger uploads
; should raise this AND the matching client_max_body_size in their nginx
; vhost together - raising only one half of the pair leaves the other as
; the effective (and confusing) limit.
upload_max_filesize = 100M
post_max_size = 100M

; Currently unlimited (max_execution_time = 0) by PHP's own default - cap
; it. cron/cron.php and any long-running report/export work run via the CLI
; SAPI (no max_execution_time ceiling there) or behind a dedicated
; fastcgi_read_timeout override (see the 300s value in the nginx vhost
; template), not the default web request path, so 120s is safe headroom for
; a normal request without leaving a slow-loris-style request running
; indefinitely against php-fpm.
max_execution_time = 120

; Keep timestamp validation ON (the "off" alternative is more of a
; traditional production optimization) rather than turning it off, because
; this app supports in-place `git pull` self-updates (scripts/update_cli.php,
; admin/post/update.php). With validate_timestamps=Off, OPcache would keep
; serving pre-update bytecode after a self-update until someone remembered
; to manually reset it - most companies self-hosting this app on their own
; box will not remember that step. revalidate_freq=2 keeps the mtime check
; cheap (at most every 2s per file) without paying the cost on every request.
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
