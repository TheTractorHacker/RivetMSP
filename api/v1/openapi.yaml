              schema: {type: string}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token issued by POST /api/v1/auth
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Legacy instance-wide API key (denied on /credentials and /me)
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: {type: integer}
    PageParam:
      name: page
      in: query
      schema: {type: integer, default: 1, minimum: 1}
    LimitParam:
      name: limit
      in: query
      schema: {type: integer, default: 20}
    SearchParam:
      name: search
      in: query
      schema: {type: string}
    YearParam:
      name: year
      in: query
      schema: {type: integer}
  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Ok'}
    ReportObject:
      description: Report payload (shape varies by report; always a JSON object)
      content:
        application/json:
          schema: {type: object}
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    MethodNotAllowed:
      description: HTTP method not allowed for this resource
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Rate limit exceeded (see Retry-After header)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    ProjectListItem:
      type: object
      properties:
        id: {type: integer}
        prefix: {type: string, nullable: true}
        number: {type: integer}
        name: {type: string}
        due_at: {type: string, nullable: true}
        created_at: {type: string, nullable: true}
        completed_at: {type: string, nullable: true}
        archived_at: {type: string, nullable: true}
        client: {type: string, nullable: true}
        manager: {type: string, nullable: true}
        ticket_count: {type: integer}
        ticket_closed_count: {type: integer}
        task_count: {type: integer}
        task_completed_count: {type: integer}
    ProjectMilestone:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string, nullable: true}
        due_at: {type: string, nullable: true}
        order: {type: integer}
        status: {type: string}
        completed_at: {type: string, nullable: true}
    ProjectTask:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        status: {type: string, nullable: true}
        progress: {type: integer}
        due_at: {type: string, nullable: true}
        start_at: {type: string, nullable: true}
        milestone_id: {type: integer, nullable: true}
        completed_at: {type: string, nullable: true}
        assigned_to: {type: string, nullable: true}
        ticket_number: {type: string, nullable: true}
    ProjectTicket:
      type: object
      properties:
        id: {type: integer}
        number: {type: string}
        subject: {type: string}
        status: {type: string, nullable: true}
        status_color: {type: string, nullable: true}
        due_at: {type: string, nullable: true}
        closed_at: {type: string, nullable: true}
        assigned_to: {type: string, nullable: true}
    ProjectDetail:
      type: object
      properties:
        id: {type: integer}
        prefix: {type: string, nullable: true}
        number: {type: integer}
        name: {type: string}
        description: {type: string}
        due_at: {type: string, nullable: true}
        start_at: {type: string, nullable: true}
        created_at: {type: string, nullable: true}
        updated_at: {type: string, nullable: true}
        completed_at: {type: string, nullable: true}
        archived_at: {type: string, nullable: true}
        client: {type: string, nullable: true}
        manager: {type: string, nullable: true}
        estimated_hours: {type: number, nullable: true}
        budget_amount: {type: number, nullable: true}
        hourly_rate: {type: number, nullable: true}
        milestones: {type: array, items: {$ref: '#/components/schemas/ProjectMilestone'}}
        tasks: {type: array, items: {$ref: '#/components/schemas/ProjectTask'}}
        tickets: {type: array, items: {$ref: '#/components/schemas/ProjectTicket'}}
    ContractListItem:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        type: {type: string, nullable: true}
        status: {type: string, nullable: true, description: 'Raw contract_status value - manually set, may disagree with renewal_date; see is_expired/is_due_soon'}
        client: {type: string, nullable: true}
        value: {type: number, nullable: true}
        renewal_frequency: {type: string, nullable: true}
        start_date: {type: string, nullable: true}
        end_date: {type: string, nullable: true}
        renewal_date: {type: string, nullable: true}
        is_expired: {type: boolean}
        is_due_soon: {type: boolean, description: 'renewal_date is today or within the next 45 days'}
        has_sla: {type: boolean}
        has_allowance: {type: boolean}
    ContractSlaTier:
      type: object
      properties:
        response_time: {type: integer, nullable: true, description: 'Hours; null when not configured'}
        resolution_time: {type: integer, nullable: true, description: 'Hours; null when not configured'}
    ContractDetail:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        type: {type: string, nullable: true}
        status: {type: string, nullable: true}
        client: {type: string, nullable: true}
        value: {type: number, nullable: true}
        renewal_frequency: {type: string, nullable: true}
        start_date: {type: string, nullable: true}
        end_date: {type: string, nullable: true}
        renewal_date: {type: string, nullable: true}
        is_expired: {type: boolean}
        is_due_soon: {type: boolean}
        details: {type: string}
        sla:
          type: object
          properties:
            high: {$ref: '#/components/schemas/ContractSlaTier'}
            medium: {$ref: '#/components/schemas/ContractSlaTier'}
            low: {$ref: '#/components/schemas/ContractSlaTier'}
        allowance:
          type: object
          description: Same shape as the month/year/remote/onsite fields of AllowanceUsage, for this one contract
          properties:
            month: {type: integer}
            year: {type: integer}
            remote: {$ref: '#/components/schemas/AllowanceUsagePeriod'}
            onsite: {$ref: '#/components/schemas/AllowanceUsagePeriod'}
        documents:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              mime_type: {type: string, nullable: true}
              size: {type: integer}
              uploaded_at: {type: string, nullable: true}
              url: {type: string}
        created_at: {type: string, nullable: true}
        updated_at: {type: string, nullable: true}
    Error:
      type: object
      properties:
        error: {type: string}
    Ok:
      type: object
      properties:
        ok: {type: boolean, example: true}
    Attachment:
      type: object
      properties:
        name: {type: string}
        filename: {type: string}
        url: {type: string}
    LoginRequest:
      type: object
      description: Password login, or passkey completion (send passkey_response + challenge_token)
      properties:
        username: {type: string}
        password: {type: string}
        totp_code: {type: string}
        device_name: {type: string}
        passkey_response: {type: object}
        challenge_token: {type: string}
    LoginResponse:
      type: object
      properties:
        token: {type: string}
        user:
          type: object
          properties:
            id: {type: integer}
            name: {type: string}
            email: {type: string}
            type: {type: integer}
    PasskeyBeginResponse:
      type: object
      properties:
        challenge: {type: string}
        timeout: {type: integer}
        rpId: {type: string}
        allowCredentials: {type: array, items: {type: object}}
        userVerification: {type: string}
        challengeToken: {type: string}
    AllowanceUsagePeriod:
      type: object
      description: Included vs. used hours for one delivery method (remote or onsite) over the requested month. When this allowance isn't configured (no active contract sets it), included/remaining/pct are null and used is 0 - treat null 'included' as "feature inactive" and don't render this period.
      properties:
        included: {type: number, nullable: true, description: 'Hours included, or null if this allowance is not configured'}
        used: {type: number, description: 'Hours used so far this month (flat per-ticket rate, not actual worked time); 0 when included is null'}
        remaining: {type: number, nullable: true, description: 'included - used; negative when over allowance; null when included is null'}
        pct: {type: number, nullable: true, description: 'used / included as a percentage, capped at 100; null when included is null'}
    AllowanceUsage:
      type: object
      properties:
        month: {type: integer, description: '1-12'}
        year: {type: integer}
        remote: {$ref: '#/components/schemas/AllowanceUsagePeriod'}
        onsite: {$ref: '#/components/schemas/AllowanceUsagePeriod'}
        contracts:
          type: array
          description: Per-contract breakdown across the client's active contracts that have an allowance configured
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              remote: {$ref: '#/components/schemas/AllowanceUsagePeriod'}
              onsite: {$ref: '#/components/schemas/AllowanceUsagePeriod'}
    DashboardResponse:
      type: object
      properties:
        my_open: {type: integer}
        all_open: {type: integer}
        unread: {type: integer}
        overdue: {type: integer}
        due_today: {type: integer}
        onsite_open: {type: integer}
        queue: {type: array, items: {$ref: '#/components/schemas/TicketListItem'}}
    CreateTicketRequest:
      type: object
      required: [subject]
      properties:
        subject: {type: string}
        details: {type: string}
        client_id: {type: integer}
        contact_id: {type: integer}
        assigned_to: {type: integer}
        category_id: {type: integer}
        priority: {type: string, enum: [low, medium, high, critical]}
        hostname: {type: string}
    AddReplyRequest:
      type: object
      required: [reply]
      properties:
        reply: {type: string}
        type: {type: string, description: "reply | note | client (customer/portal/website)"}
        time_worked: {type: string, description: HH:MM:SS}
        onsite: {type: integer, enum: [0, 1]}
        contact_id: {type: integer}
    TicketListItem:
      type: object
      properties:
        id: {type: integer}
        number: {type: integer}
        subject: {type: string}
        priority: {type: string}
        status: {type: string}
        status_color: {type: string}
        client: {type: string}
        assigned_to: {type: string}
        created_at: {type: string}
        due_at: {type: string, nullable: true}
        resolved_at: {type: string, nullable: true}
        updated_at: {type: string}
    TicketDetail:
      type: object
      properties:
        id: {type: integer}
        number: {type: integer}
        subject: {type: string}
        details: {type: string}
        priority: {type: string}
        status: {type: string}
        status_color: {type: string}
        client: {type: string}
        assigned_to: {type: string}
        contact_name: {type: string}
        contact_email: {type: string}
        contact_phone: {type: string}
        billable: {type: boolean}
        created_at: {type: string}
        due_at: {type: string, nullable: true}
        resolved_at: {type: string, nullable: true}
        attachments: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
        replies: {type: array, items: {$ref: '#/components/schemas/TicketReply'}}
    TicketReply:
      type: object
      properties:
        id: {type: integer}
        body: {type: string}
        type: {type: string}
        time_worked: {type: string, nullable: true}
        onsite: {type: boolean}
        by: {type: string}
        created_at: {type: string}
        attachments: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
    ChatMessage:
      type: object
      properties:
        id: {type: integer}
        sender_type: {type: string, enum: [agent, contact]}
        sender_id: {type: integer}
        sender_name: {type: string}
        message: {type: string}
        created_at: {type: string}
    TicketStatus:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        color: {type: string}
    TicketCategory:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        color: {type: string}
    SavedTicketView:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        icon: {type: string}
        params: {type: object, additionalProperties: {type: string}}
    ClientListItem:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        phone: {type: string, nullable: true}
        city: {type: string, nullable: true}
        state: {type: string, nullable: true}
        website: {type: string, nullable: true}
    ClientDetail:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        phone: {type: string, nullable: true}
        address: {type: string, nullable: true}
        city: {type: string, nullable: true}
        state: {type: string, nullable: true}
        zip: {type: string, nullable: true}
        website: {type: string, nullable: true}
        notes: {type: string}
        open_tickets: {type: integer}
        contacts: {type: array, items: {$ref: '#/components/schemas/Contact'}}
    Contact:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        title: {type: string, nullable: true}
        email: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        extension: {type: string, nullable: true}
        client: {type: string, nullable: true}
    ClientLocation:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        address: {type: string, nullable: true}
        city: {type: string, nullable: true}
        state: {type: string, nullable: true}
        zip: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        primary: {type: boolean}
    AssetListItem:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        type: {type: string, nullable: true}
        make: {type: string, nullable: true}
        model: {type: string, nullable: true}
        serial: {type: string, nullable: true}
        os: {type: string, nullable: true}
        status: {type: string, nullable: true}
        client: {type: string, nullable: true}
    AssetDetail:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        type: {type: string, nullable: true}
        make: {type: string, nullable: true}
        model: {type: string, nullable: true}
        serial: {type: string, nullable: true}
        os: {type: string, nullable: true}
        status: {type: string, nullable: true}
        description: {type: string}
        physical_location: {type: string}
        location_name: {type: string}
        location_city: {type: string}
        location_state: {type: string}
        contact_name: {type: string}
        contact_phone: {type: string}
        client: {type: string, nullable: true}
        created_at: {type: string, nullable: true}
        purchase_date: {type: string}
        warranty_expire: {type: string}
        notes: {type: string}
    CredentialListItem:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        username: {type: string, nullable: true}
        uri: {type: string, nullable: true}
        client: {type: string, nullable: true}
    CredentialDetail:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        username: {type: string}
        password: {type: string}
        uri: {type: string, nullable: true}
        uri_2: {type: string}
        otp_secret: {type: string}
        note: {type: string}
        client: {type: string, nullable: true}
    LineItem:
      type: object
      properties:
        description: {type: string}
        quantity: {type: number}
        unit_price: {type: number}
        total: {type: number}
        taxable: {type: boolean}
    QuoteListItem:
      type: object
      properties:
        id: {type: integer}
        number: {type: string}
        subject: {type: string}
        status: {type: string}
        date: {type: string}
        total: {type: number}
        client: {type: string, nullable: true}
        guest_url: {type: string, nullable: true}
    QuoteDetail:
      allOf:
        - $ref: '#/components/schemas/QuoteListItem'
        - type: object
          properties:
            subtotal: {type: number}
            tax: {type: number}
            notes: {type: string}
            items: {type: array, items: {$ref: '#/components/schemas/LineItem'}}
    InvoiceListItem:
      type: object
      properties:
        id: {type: integer}
        number: {type: string}
        date: {type: string}
        due_date: {type: string, nullable: true}
        status: {type: string}
        total: {type: number}
        client: {type: string, nullable: true}
        guest_url: {type: string, nullable: true}
    InvoiceDetail:
      allOf:
        - $ref: '#/components/schemas/InvoiceListItem'
        - type: object
          properties:
            subtotal: {type: number}
            tax: {type: number}
            notes: {type: string}
            items: {type: array, items: {$ref: '#/components/schemas/LineItem'}}
    Expense:
      type: object
      properties:
        id: {type: integer}
        description: {type: string}
        amount: {type: number}
        currency: {type: string}
        date: {type: string}
        reference: {type: string, nullable: true}
        payment_method: {type: string, nullable: true}
        has_receipt: {type: boolean}
        client: {type: string, nullable: true}
    Charge:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string, nullable: true}
        quantity: {type: number}
        unit_price: {type: number}
        total: {type: number}
        invoiced: {type: boolean}
        created_by: {type: string, nullable: true}
        created_at: {type: string}
    WorksheetSummary:
      type: object
      properties:
        id: {type: integer}
        template_name: {type: string, nullable: true}
        created_by: {type: string, nullable: true}
        created_at: {type: string}
        completed_at: {type: string, nullable: true}
        signed_name: {type: string, nullable: true}
        signed_at: {type: string, nullable: true}
        is_outtake: {type: boolean}
        signed: {type: boolean}
    WorksheetDetail:
      type: object
      properties:
        id: {type: integer}
        template_name: {type: string, nullable: true}
        signed_name: {type: string, nullable: true}
        signed_at: {type: string, nullable: true}
        completed_at: {type: string, nullable: true}
        signed: {type: boolean}
        fields:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              type: {type: string}
              options: {type: string, nullable: true}
              required: {type: boolean}
              value: {type: string, nullable: true}
    WorksheetTemplate:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string, nullable: true}
    OuttakeSummary:
      type: object
      properties:
        id: {type: integer}
        sign_token: {type: string, nullable: true}
        notes: {type: string, nullable: true}
        created_by: {type: string, nullable: true}
        created_at: {type: string}
        signed_name: {type: string, nullable: true}
        signed_at: {type: string, nullable: true}
        signed: {type: boolean}
    OuttakeDetail:
      allOf:
        - $ref: '#/components/schemas/OuttakeSummary'
        - type: object
          properties:
            ticket_subject: {type: string, nullable: true}
            client: {type: string, nullable: true}
            contact_name: {type: string, nullable: true}
    SignRequest:
      type: object
      required: [signed_name]
      properties:
        signed_name: {type: string}
        signature: {type: string, description: "data:image/png;base64,... (optional)"}
    Product:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        type: {type: string, nullable: true}
        description: {type: string, nullable: true}
        price: {type: number}
        currency: {type: string, nullable: true}
        code: {type: string, nullable: true}
    SearchResult:
      type: object
      properties:
        tickets: {type: array, items: {$ref: '#/components/schemas/TicketListItem'}}
        clients: {type: array, items: {$ref: '#/components/schemas/ClientListItem'}}
        assets: {type: array, items: {$ref: '#/components/schemas/AssetListItem'}}
    KbCategory:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        parent_id: {type: integer}
        client_id: {type: integer}
    KbArticleListItem:
      type: object
      properties:
        id: {type: integer}
        title: {type: string}
        category_id: {type: integer}
        category_name: {type: string, nullable: true}
        client_id: {type: integer}
        client_name: {type: string, nullable: true}
        client_visible: {type: integer}
        updated_at: {type: string}
    KbArticleDetail:
      allOf:
        - $ref: '#/components/schemas/KbArticleListItem'
        - type: object
          properties:
            content: {type: string}
            attachments: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
    UserProfile:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string}
        type: {type: integer}
        color: {type: string, nullable: true}
        avatar: {type: string, nullable: true}
    UpdateProfileRequest:
      type: object
      description: >
        One of several shapes. Profile update: name+email (+ current_password/new_password).
        Push registration: fcm_token. Biometric registration: device_public_key_pem.
      properties:
        name: {type: string}
        email: {type: string}
        current_password: {type: string}
        new_password: {type: string}
        fcm_token: {type: string}
        device_public_key_pem: {type: string}
    Appointment:
      type: object
      properties:
        id: {type: integer}
        ticket_id: {type: integer}
        number: {type: integer}
        subject: {type: string}
        schedule: {type: string, nullable: true}
        schedule_end: {type: string, nullable: true}
        onsite: {type: boolean}
        notes: {type: string, nullable: true}
        priority: {type: string, nullable: true}
        status: {type: string, nullable: true}
        status_color: {type: string, nullable: true}
        client: {type: string, nullable: true}
        assigned_to: {type: string, nullable: true}
    CreateAppointmentRequest:
      type: object
      required: [ticket_id, schedule_start]
      properties:
        ticket_id: {type: integer}
        schedule_start: {type: string, description: "Y-m-d H:i:s"}
        schedule_end: {type: string, nullable: true}
        onsite: {type: boolean}
        notes: {type: string}
    Notification:
      type: object
      properties:
        id: {type: integer}
        type: {type: string}
        message: {type: string}
        action: {type: string, nullable: true}
        timestamp: {type: string}
    Alert:
      type: object
      properties:
        source: {type: string, enum: [rmm, backup]}
        id: {type: integer}
        severity: {type: string, enum: [critical, error, warning, info]}
        message: {type: string}
        subject: {type: string, nullable: true}
        client_id: {type: integer, nullable: true}
        client_name: {type: string, nullable: true}
        status: {type: string}
        created_at: {type: string}
        ticket_id: {type: integer, nullable: true}
        ticket_label: {type: string, nullable: true}
    AlertActionRequest:
      type: object
      required: [source, id, action]
      properties:
        source: {type: string, enum: [rmm, backup]}
        id: {type: integer}
        action: {type: string, enum: [acknowledge, resolve]}
