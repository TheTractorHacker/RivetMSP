  /agent_enroll:
    post:
      tags: [Endpoint agent]
      summary: Enroll a Windows endpoint agent (device-facing, no Bearer)
      description: >
        Exchanges a short-lived enrollment token (carried in the body) for a unique per-device credential, shown once; only its SHA-256 is
        stored. Same install_id again, or a reinstall of the same machine (machine_guid or serial), keeps the device id and rotates the
        credential. Two different machines are never merged: ambiguous, out-of-client, hostname-only or already-owned matches return
        status pending_approval or ambiguous and wait for an administrator. TLS required. Rate limited per address (429 + Retry-After).
        See docs/ENDPOINT_AGENT.md.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentEnrollRequest'}
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentEnrollResponse'}
        '401': {description: "Error code invalid_token, revoked or expired", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '403': {description: "Service disabled, token exhausted, or the device was revoked/retired (code forbidden)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '409': {description: "install_id belongs to a different machine (code conflict)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '413': {description: "Body too large", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '422': {description: "Invalid body (code invalid)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '429': {description: "Too many attempts (Retry-After header)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /agent_checkin:
    post:
      tags: [Endpoint agent]
      summary: "Device check-in: inventory, metrics, checks (device credential)"
      description: >
        Idempotent by (device_id, seq): a retried check-in is acknowledged but never double counted. A missing metric (null or absent) is
        never stored as zero. collected_at must not be in the future (5 minutes skew) or older than the retention window; invalid buffered
        samples are dropped, not fatal. Feeds the existing asset RMM link, device metrics and RMM alerts (debounced, deduplicated).
        Optional extra field update_result {version, state ok|failed|rolled_back, detail} reports the last agent update.
      security: [{deviceAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentCheckinRequest'}
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCheckinResponse'}
        '401': {description: "Credential invalid_token, revoked or expired", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '403': {description: "Service disabled", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '413': {description: "Body over 1 MiB", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '422': {description: "Invalid payload", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '429': {description: "Rate limited (Retry-After header)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /agent_jobs:
    get:
      tags: [Endpoint agent]
      summary: Fetch this device's signed jobs (device credential, optional long poll)
      description: >
        Returns only the calling device's queued jobs, each signed (Ed25519 over the canonical JSON of the job fields). wait=1..5 holds the
        request open up to that many seconds. A destructive job (reboot, or flagged) is offered at most once; a harmless job whose
        acknowledgement was lost is re-offered with attempt + 1. A revoked device gets 401 revoked immediately.
      security: [{deviceAuth: []}]
      parameters:
        - {name: wait, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 5}}
      responses:
        '200':
          description: Jobs (possibly empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: {type: array, items: {$ref: '#/components/schemas/AgentJob'}}
        '401': {description: "Credential invalid_token, revoked or expired", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '429': {description: "Rate limited", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
    post:
      tags: [Endpoint agent]
      summary: Report a job's state or result (device credential)
      description: >
        Idempotent for a repeated identical final state; a conflicting final state, a cancelled/expired job, or a state going back to
        running is 409. Output is credential-redacted and capped before storage. A late real result replaces a server-side result_lost.
      security: [{deviceAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentJobReport'}
      responses:
        '200': {description: "Recorded", content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {description: "Credential invalid", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '404': {description: "Unknown job for this device", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '409': {description: "Conflict", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '413': {description: "Body over 256 KiB", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '422': {description: "Invalid body", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /agent_installer:
    post:
      tags: [Endpoint agent]
      summary: Download the stamped per-client installer with an enrollment token (for RMM, Intune, GPO scripts)
      description: >
        Public, token-gated. The enrollment token goes in the JSON or form body (or an Authorization Bearer header), NEVER in the query string
        (a token in the URL is refused with 400 so it stays out of access logs). Returns the current agent executable for the architecture
        with the client's installer payload and a 52-byte footer appended (see docs/ENDPOINT_AGENT.md section 'Stamped installer format'),
        streamed with an exact Content-Length. Any token that is not usable now (unknown, wrong, revoked, expired, used up) gets the same
        generic 404. Rate limited per address and per token from the database (429 + Retry-After). Successes and rejections are audited.
        The download does not consume an enrollment use; enrolling does.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arch]
              properties:
                token: {type: string, description: "rvte1.<selector>.<secret>; may instead be sent as Authorization Bearer"}
                arch: {type: string, enum: [amd64, arm64]}
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [arch]
              properties:
                token: {type: string}
                arch: {type: string, enum: [amd64, arm64]}
      responses:
        '200':
          description: The stamped installer (RivetIT-Agent-Setup-<client>-<arch>.exe)
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400': {description: "Token supplied in the query string (code token_in_url)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '403': {description: "Service disabled", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '404': {description: "Generic: the token is not usable", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '405': {description: "Use POST", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '409': {description: "No published binary for that architecture, or no https service URL (code unavailable)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '413': {description: "Body over 4 KiB", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '422': {description: "token or arch missing or invalid", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '429': {description: "Too many requests (Retry-After header)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /agent_update:
    get:
      tags: [Endpoint agent]
      summary: Download the hosted agent release this device is currently offered (device credential)
      description: >
        Streams the UNSTAMPED agent executable of the server-hosted release named by the update manifest (its url points here). Only the release
        the manifest offers THIS device right now is served, only for its own architecture, and only while the stored file still matches the
        manifest SHA-256. Anything else is a generic 404. Content-Length exact, nosniff, no-store.
      security: [{deviceAuth: []}]
      parameters:
        - {name: arch, in: query, required: true, schema: {type: string, enum: [amd64, arm64]}}
        - {name: version, in: query, required: true, schema: {type: string, example: 1.2.0}}
      responses:
        '200':
          description: The agent executable
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {description: "Credential invalid_token, revoked or expired", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '404': {description: "Not offered to this device (or damaged)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '422': {description: "arch or version invalid", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '429': {description: "Rate limited", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '503': {description: "The stored binary is missing or failed its integrity check", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /endpoint_devices:
    get:
      tags: [Endpoint agent]
      summary: List endpoint agent devices in the caller's clients
      description: Needs a user token and RMM (module_rmm) view access. Module-only logins and the legacy shared key get 403.
      parameters:
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
        - {name: offset, in: query, schema: {type: integer}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/EndpointDevice'}}
                  total: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /endpoint_devices/{id}:
    get:
      tags: [Endpoint agent]
      summary: Device detail with inventory, checks and recent jobs
      description: A device outside the caller's clients is a 404 (indistinguishable from a missing one). Job output needs module_rmm_scripts level 2.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: "Device", content: {application/json: {schema: {$ref: '#/components/schemas/EndpointDevice'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /endpoint_devices/{id}/jobs:
    get:
      tags: [Endpoint agent]
      summary: Job history for a device
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: "Jobs", content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Endpoint agent]
      summary: Queue a maintenance job (PowerShell, saved script, collect, reboot)
      description: >
        Authorization is decided server-side per call: free-form PowerShell needs module_rmm_scripts level 3, a saved script, reboot or
        collect level 2, always with module_rmm view access and the device's client. Module-only logins are refused. A reboot or any
        destructive job needs "confirm": true and is never retried automatically.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EndpointJobRequest'}
      responses:
        '201': {description: "Queued", content: {application/json: {schema: {type: object, properties: {job_id: {type: string}, state: {type: string}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {description: "Invalid or confirmation_required", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /endpoint_devices/{id}/jobs/{job_id}/cancel:
    post:
      tags: [Endpoint agent]
      summary: Cancel a queued job
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: job_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: "Only a queued job can be cancelled", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /endpoint_devices/{id}/remote:
    post:
      tags: [Endpoint agent]
      summary: Launch a MeshCentral remote session for a device
      description: >
        Needs module_rmm_remote_connect, module_rmm view, the device's client, and a device mapped to a MeshCentral node. Returns a
        one-time login URL minted for this request (never stored or logged) and a safe session id. Unmapped is 404, offline/not
        configured/retired 409 (set force to launch an offline-looking device anyway), MeshCentral unreachable 503.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {force: {type: boolean}}}
      responses:
        '200': {description: "Launch URL", content: {application/json: {schema: {type: object, properties: {url: {type: string}, session_id: {type: string}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: "Not found, or code unmapped", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '409': {description: "device_offline, not_configured or device_retired", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '503': {description: "MeshCentral unavailable", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token issued by POST /api/v1/auth
    deviceAuth:
      type: http
      scheme: bearer
      description: Per-device credential issued by POST /agent_enroll (256-bit, only its SHA-256 stored, rotatable and revocable). Not a user token.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Legacy instance-wide API key (denied on /credentials and /me)
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: {type: integer}
    PageParam:
      name: page
      in: query
      schema: {type: integer, default: 1, minimum: 1}
    LimitParam:
      name: limit
      in: query
      schema: {type: integer, default: 20}
    SearchParam:
      name: search
      in: query
      schema: {type: string}
    YearParam:
      name: year
      in: query
      schema: {type: integer}
  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Ok'}
    ReportObject:
      description: Report payload (shape varies by report; always a JSON object)
      content:
        application/json:
          schema: {type: object}
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    MethodNotAllowed:
      description: HTTP method not allowed for this resource
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Rate limit exceeded (see Retry-After header)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
    Ok:
      type: object
      properties:
        ok: {type: boolean, example: true}
    Attachment:
      type: object
      properties:
        name: {type: string}
        filename: {type: string}
        url: {type: string}
    LoginRequest:
      type: object
      description: Password login, or passkey completion (send passkey_response + challenge_token)
      properties:
        username: {type: string}
        password: {type: string}
        totp_code: {type: string}
        device_name: {type: string}
        passkey_response: {type: object}
        challenge_token: {type: string}
    LoginResponse:
      type: object
      properties:
        token: {type: string}
        user:
          type: object
          properties:
            id: {type: integer}
            name: {type: string}
            email: {type: string}
            type: {type: integer}
    PasskeyBeginResponse:
      type: object
      properties:
        challenge: {type: string}
        timeout: {type: integer}
        rpId: {type: string}
        allowCredentials: {type: array, items: {type: object}}
        userVerification: {type: string}
        challengeToken: {type: string}
    AllowanceUsagePeriod:
      type: object
      description: Included vs. used hours for one delivery method (remote or onsite) over the requested month. When this allowance isn't configured (no active contract sets it), included/remaining/pct are null and used is 0 - treat null 'included' as "feature inactive" and don't render this period.
      properties:
        included: {type: number, nullable: true, description: 'Hours included, or null if this allowance is not configured'}
        used: {type: number, description: 'Hours used so far this month (flat per-ticket rate, not actual worked time); 0 when included is null'}
        remaining: {type: number, nullable: true, description: 'included - used; negative when over allowance; null when included is null'}
        pct: {type: number, nullable: true, description: 'used / included as a percentage, capped at 100; null when included is null'}
    AllowanceUsage:
      type: object
      properties:
        month: {type: integer, description: '1-12'}
        year: {type: integer}
        remote: {$ref: '#/components/schemas/AllowanceUsagePeriod'}
        onsite: {$ref: '#/components/schemas/AllowanceUsagePeriod'}
        contracts:
          type: array
          description: Per-contract breakdown across the client's active contracts that have an allowance configured
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              remote: {$ref: '#/components/schemas/AllowanceUsagePeriod'}
              onsite: {$ref: '#/components/schemas/AllowanceUsagePeriod'}
    DashboardResponse:
      type: object
      properties:
        my_open: {type: integer}
        all_open: {type: integer}
        unread: {type: integer}
        overdue: {type: integer}
        due_today: {type: integer}
        onsite_open: {type: integer}
        queue: {type: array, items: {$ref: '#/components/schemas/TicketListItem'}}
    CreateTicketRequest:
