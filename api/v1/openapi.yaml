openapi: 3.0.3
info:
  title: RivetMSP API v1
  version: 1.0.0
  description: >
    Companion REST API for RivetMSP, consumed by the RivetMSP mobile app and
    integrations (ITPanel Pro, RMM scripts). This spec documents the *live*
    endpoints served by /api/v1/index.php and its per-resource handlers.


    Authentication: send a bearer token issued by POST /auth
    (`Authorization: Bearer <token>`) OR a legacy instance API key
    (`X-Api-Key: <key>`). The legacy key resolves to the first active admin and
    is intentionally denied on `/credentials` and `/me`. The `/auth`,
    `/branding`, `/openapi` and `/docs` endpoints are public (no token required).


    Response conventions:
      * Paged list endpoints return `{ "data": [ ... ], "total": <int> }`
        (some also add `page`/`limit`).
      * Some list endpoints return a bare JSON array (noted per-endpoint).
      * Creates return `{ "id": <int> }` (sometimes with extra fields).
      * Simple mutations return `{ "ok": true }`.
      * Errors return `{ "error": "<message>" }` with the matching HTTP status.
servers:
  - url: /api/v1
    description: Relative to the RivetMSP install host
tags:
  - name: Auth
  - name: Dashboard
  - name: Tickets
  - name: Ticket Meta
  - name: Clients
  - name: Contacts
  - name: Assets
  - name: Credentials
  - name: Quotes
  - name: Invoices
  - name: Expenses
  - name: Worksheets
  - name: Outtakes
  - name: Products
  - name: Search
  - name: Reports
  - name: Knowledge Base
  - name: Profile
  - name: Appointments
  - name: Notifications
  - name: Alerts
  - name: Diagnostics
  - name: Public
  - name: Meta
  - name: Endpoint agent
security:
  - bearerAuth: []
  - ApiKeyAuth: []
paths:
  /branding:
    get:
      tags: [Auth]
      summary: Public company identity for mobile sign-in and app branding
      description: Returns the same company name and uploaded logo shown on the public login page. An uploaded logo replaces product artwork. No credentials or settings are returned.
      security: []
      responses:
        '200':
          description: Company identity; null logo_path means use the RivetMSP fallback
          content:
            application/json:
              schema:
                type: object
                required: [name, logo_path]
                properties:
                  name:
                    type: string
                  logo_path:
                    type: string
                    nullable: true
                    example: /uploads/settings/company-logo.png
        '429':
          description: Rate limit exceeded
  /auth:
    post:
      tags: [Auth]
      summary: Password login — returns a bearer token, or requires_2fa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token issued, or 2FA required, or (for passkey completion) token issued
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - type: object
                    properties:
                      requires_2fa: {type: boolean, example: true}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
    get:
      tags: [Auth]
      summary: Begin a WebAuthn/passkey assertion — returns a challenge
      security: []
      responses:
        '200':
          description: Passkey assertion options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyBeginResponse'
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Auth]
      summary: Logout — revoke the current bearer token
      responses:
        '200': {$ref: '#/components/responses/Ok'}
  /crash-reports:
    post:
      tags: [Diagnostics]
      summary: Report a mobile app crash (logged to App Logs, category "mobile_crash")
      description: >
        Semi-public: reachable without a valid bearer token, because the crash most
        worth seeing is exactly the one that happens before login succeeds or while
        a token is invalid/expired. A token is honored for caller correlation when
        present, but never required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stack_trace]
              properties:
                platform: {type: string, example: android}
                app_version_name: {type: string, example: "1.13.0"}
                app_version_code: {type: integer, example: 19}
                device_model: {type: string, example: "Pixel 8"}
                os_version: {type: string, example: "15"}
                sdk_int: {type: integer, example: 35}
                thread_name: {type: string, example: main}
                is_fatal: {type: boolean, default: true}
                occurred_at: {type: string, format: date-time}
                stack_trace: {type: string}
      responses:
        '201':
          description: Logged
          content:
            application/json:
              schema:
                type: object
                properties: {logged: {type: boolean, example: true}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /csat:
    get:
      tags: [Public]
      summary: Aggregate CSAT rating summary for public embedding (e.g. a website trust badge)
      description: >
        Fully public: no bearer token or API key accepted or required. Returns only
        the aggregate rating and anonymous 4-5 star comment snippets - never client
        names, contact names, or ticket subjects - so the response is safe to embed
        directly on a public marketing site with no further filtering by the caller.
        Cached for 5 minutes (Cache-Control: public, max-age=300).
      security: []
      responses:
        '200':
          description: CSAT summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  average_rating: {type: number, format: float, nullable: true, example: 4.8}
                  total_ratings: {type: integer, example: 132}
                  rating_breakdown:
                    type: object
                    properties:
                      "1": {type: integer}
                      "2": {type: integer}
                      "3": {type: integer}
                      "4": {type: integer}
                      "5": {type: integer}
                  testimonials:
                    type: array
                    items:
                      type: object
                      properties:
                        rating: {type: integer, example: 5}
                        comment: {type: string, example: "Great information on the specs. Thank you for putting this together."}
                        date: {type: string, format: date, example: "2026-07-31"}
        '405': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Agent dashboard counters and personal ticket queue
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tickets:
    get:
      tags: [Tickets]
      summary: List tickets (paged, filterable)
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, closed, all], default: open}}
        - {name: mine, in: query, schema: {type: integer, enum: [0, 1]}}
        - {$ref: '#/components/parameters/SearchParam'}
        - {$ref: '#/components/parameters/PageParam'}
        - {$ref: '#/components/parameters/LimitParam'}
        - {name: priority, in: query, schema: {type: string, enum: [low, medium, high, critical]}}
        - {name: onsite, in: query, schema: {type: integer, enum: [0, 1]}}
        - {name: category_id, in: query, schema: {type: integer}}
        - {name: client_id, in: query, schema: {type: integer}}
        - {name: contact_id, in: query, schema: {type: integer}}
        - {name: overdue, in: query, schema: {type: integer}}
        - {name: due_today, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Paged ticket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/TicketListItem'}}
                  total: {type: integer}
                  page: {type: integer}
                  limit: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Tickets]
      summary: Create a ticket (JSON or multipart with files)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  number: {type: integer}
                  attachments: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Ticket detail with replies and attachments
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /tickets/{id}/reply:
    post:
      tags: [Tickets]
      summary: Add a reply or internal note (JSON or multipart with files)
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddReplyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddReplyRequest'
      responses:
        '201':
          description: Reply created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  type: {type: string}
                  ticket_status: {type: object, properties: {id: {type: integer}, name: {type: string}}}
                  attachments: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /tickets/{id}/reply/{replyId}:
    delete:
      tags: [Tickets]
      summary: Delete a reply (and its attachments)
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
        - {name: replyId, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /tickets/{id}/time:
    post:
      tags: [Tickets]
      summary: Log time against a ticket (creates an internal reply)
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [time_worked]
              properties:
                time_worked: {type: string, example: "01:30:00", description: HH:MM:SS}
                note: {type: string}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /tickets/{id}/status:
    post:
      tags: [Tickets]
      summary: Change ticket status (setting a Closed status resolves it)
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status_id]
              properties:
                status_id: {type: integer}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /tickets/{id}/attachments:
    post:
      tags: [Tickets]
      summary: Upload one or more attachments to a ticket
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
                'files[]': {type: array, items: {type: string, format: binary}}
      responses:
        '201':
          description: Attachment(s) saved
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Attachment'
                  - type: object
                    properties:
                      attachments: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /tickets/{id}/chat:
    get:
      tags: [Tickets]
      summary: Live-chat messages for a ticket (add ?stream=1 for an SSE feed)
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
        - {name: since_id, in: query, schema: {type: integer, default: 0}}
        - {name: stream, in: query, schema: {type: integer}, description: When present, responds with a text/event-stream SSE feed instead of JSON}
      responses:
        '200':
          description: Chat messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ChatMessage'}}
            text/event-stream:
              schema: {type: string}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Tickets]
      summary: Send a live-chat message
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string}
                contact_id: {type: integer, description: Post on behalf of one of the ticket's client's contacts}
      responses:
        '201':
          description: Message stored
          content:
            application/json:
              schema:
                type: object
                properties: {id: {type: integer}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /tickets/{id}/charges:
    get:
      tags: [Tickets]
      summary: List charges on a ticket
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Charges plus running total
          content:
            application/json:
              schema:
                type: object
                properties:
                  charges: {type: array, items: {$ref: '#/components/schemas/Charge'}}
                  total: {type: number}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Tickets]
      summary: Add a charge to a ticket
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                description: {type: string}
                quantity: {type: number, default: 1}
                unit_price: {type: number, default: 0}
      responses:
        '201':
          description: Charge created
          content:
            application/json:
              schema:
                type: object
                properties: {id: {type: integer}, total: {type: number}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /tickets/{id}/worksheets:
    get:
      tags: [Worksheets]
      summary: List worksheets attached to a ticket
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Worksheet summaries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WorksheetSummary'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Worksheets]
      summary: Create a worksheet on a ticket from a template
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id]
              properties:
                template_id: {type: integer}
                is_outtake: {type: integer, enum: [0, 1]}
      responses:
        '201':
          description: Worksheet created
          content:
            application/json:
              schema:
                type: object
                properties: {id: {type: integer}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /tickets/{id}/outtakes:
    get:
      tags: [Outtakes]
      summary: List device-outtake (pickup) forms for a ticket
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Outtake summaries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OuttakeSummary'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /tickets/{id}/outtake:
    post:
      tags: [Outtakes]
      summary: Create a device-outtake form on a ticket
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '201':
          description: Outtake created
          content:
            application/json:
              schema:
                type: object
                properties: {id: {type: integer}}
  /statuses:
    get:
      tags: [Ticket Meta]
      summary: List active ticket statuses (bare array)
      responses:
        '200':
          description: Ticket statuses
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TicketStatus'}
  /ticket-categories:
    get:
      tags: [Ticket Meta]
      summary: List ticket categories (bare array)
      responses:
        '200':
          description: Ticket categories
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TicketCategory'}
  /ticket-views:
    get:
      tags: [Ticket Meta]
      summary: List saved ticket views translated to list query params (bare array)
      responses:
        '200':
          description: Saved views
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SavedTicketView'}
  /clients:
    get:
      tags: [Clients]
      summary: List clients (paged)
      parameters:
        - {$ref: '#/components/parameters/SearchParam'}
        - {$ref: '#/components/parameters/PageParam'}
        - {$ref: '#/components/parameters/LimitParam'}
      responses:
        '200':
          description: Paged client list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ClientListItem'}}
                  total: {type: integer}
        '403': {$ref: '#/components/responses/Forbidden'}
  /clients/{id}:
    get:
      tags: [Clients]
      summary: Client detail with contacts and primary location
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Client detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /clients/{id}/tickets:
    get:
      tags: [Clients]
      summary: Recent tickets for a client (bare array)
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Ticket summaries
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/TicketListItem'}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /clients/{id}/assets:
    get:
      tags: [Clients]
      summary: Assets for a client (bare array)
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Asset summaries
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AssetListItem'}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /clients/{id}/locations:
    get:
      tags: [Clients]
      summary: Locations for a client (bare array)
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ClientLocation'}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /clients/{id}/credentials:
    get:
      tags: [Clients]
      summary: Credential names for a client (no secrets; bare array)
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Credential summaries
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CredentialListItem'}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /clients/{id}/contracts:
    get:
      tags: [Clients]
      summary: Contracts for a client (bare array)
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Contracts
          content:
            application/json:
              schema: {type: array, items: {type: object}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /clients/{id}/files:
    get:
      tags: [Clients]
      summary: Signed outtake forms for a client (bare array)
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Files
          content:
            application/json:
              schema: {type: array, items: {type: object}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /clients/{id}/allowance:
    get:
      tags: [Clients]
      summary: Included support-hours allowance vs. usage for a calendar month, rolled up across the client's active contracts plus a per-contract breakdown
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
        - {name: month, in: query, description: '1-12, defaults to current month', schema: {type: integer}}
        - {name: year, in: query, description: 'defaults to current year', schema: {type: integer}}
      responses:
        '200':
          description: Allowance usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowanceUsage'
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /contacts:
    get:
      tags: [Contacts]
      summary: List contacts (paged, filterable by client)
      parameters:
        - {name: client_id, in: query, schema: {type: integer}}
        - {$ref: '#/components/parameters/SearchParam'}
        - {$ref: '#/components/parameters/PageParam'}
        - {$ref: '#/components/parameters/LimitParam'}
      responses:
        '200':
          description: Paged contact list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Contact'}}
                  total: {type: integer}
  /assets:
    get:
      tags: [Assets]
      summary: List assets (paged, filterable)
      parameters:
        - {$ref: '#/components/parameters/SearchParam'}
        - {$ref: '#/components/parameters/PageParam'}
        - {$ref: '#/components/parameters/LimitParam'}
        - {name: type, in: query, schema: {type: string}}
        - {name: client_id, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Paged asset list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/AssetListItem'}}
                  total: {type: integer}
  /assets/types:
    get:
      tags: [Assets]
      summary: Distinct asset types in use (bare string array)
      responses:
        '200':
          description: Asset type names
          content:
            application/json:
              schema: {type: array, items: {type: string}}
  /assets/{id}:
    get:
      tags: [Assets]
      summary: Asset detail
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Asset detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
  /credentials:
    get:
      tags: [Credentials]
      summary: List credentials (names/URIs only, no secrets; paged). Requires a user token — legacy API key is denied.
      parameters:
        - {$ref: '#/components/parameters/SearchParam'}
        - {$ref: '#/components/parameters/PageParam'}
        - {$ref: '#/components/parameters/LimitParam'}
        - {name: client_id, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Paged credential list (no secrets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/CredentialListItem'}}
                  total: {type: integer}
        '403': {$ref: '#/components/responses/Forbidden'}
  /credentials/{id}:
    get:
      tags: [Credentials]
