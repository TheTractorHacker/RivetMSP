      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        type: {type: string, nullable: true}
        description: {type: string, nullable: true}
        price: {type: number}
        currency: {type: string, nullable: true}
        code: {type: string, nullable: true}
    SearchResult:
      type: object
      properties:
        tickets: {type: array, items: {$ref: '#/components/schemas/TicketListItem'}}
        clients: {type: array, items: {$ref: '#/components/schemas/ClientListItem'}}
        assets: {type: array, items: {$ref: '#/components/schemas/AssetListItem'}}
    KbCategory:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        parent_id: {type: integer}
        client_id: {type: integer}
    KbArticleListItem:
      type: object
      properties:
        id: {type: integer}
        title: {type: string}
        category_id: {type: integer}
        category_name: {type: string, nullable: true}
        client_id: {type: integer}
        client_name: {type: string, nullable: true}
        client_visible: {type: integer}
        updated_at: {type: string}
    KbArticleDetail:
      allOf:
        - $ref: '#/components/schemas/KbArticleListItem'
        - type: object
          properties:
            content: {type: string}
            attachments: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
    UserProfile:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string}
        type: {type: integer}
        color: {type: string, nullable: true}
        avatar: {type: string, nullable: true}
    UpdateProfileRequest:
      type: object
      description: >
        One of several shapes. Profile update: name+email (+ current_password/new_password).
        Push registration: fcm_token. Biometric registration: device_public_key_pem.
      properties:
        name: {type: string}
        email: {type: string}
        current_password: {type: string}
        new_password: {type: string}
        fcm_token: {type: string}
        device_public_key_pem: {type: string}
    Appointment:
      type: object
      properties:
        id: {type: integer}
        ticket_id: {type: integer}
        number: {type: integer}
        subject: {type: string}
        schedule: {type: string, nullable: true}
        schedule_end: {type: string, nullable: true}
        onsite: {type: boolean}
        notes: {type: string, nullable: true}
        priority: {type: string, nullable: true}
        status: {type: string, nullable: true}
        status_color: {type: string, nullable: true}
        client: {type: string, nullable: true}
        assigned_to: {type: string, nullable: true}
    CreateAppointmentRequest:
      type: object
      required: [ticket_id, schedule_start]
      properties:
        ticket_id: {type: integer}
        schedule_start: {type: string, description: "Y-m-d H:i:s"}
        schedule_end: {type: string, nullable: true}
        onsite: {type: boolean}
        notes: {type: string}
    Notification:
      type: object
      properties:
        id: {type: integer}
        type: {type: string}
        message: {type: string}
        action: {type: string, nullable: true}
        timestamp: {type: string}
    Alert:
      type: object
      properties:
        source: {type: string, enum: [rmm, backup]}
        id: {type: integer}
        severity: {type: string, enum: [critical, error, warning, info]}
        message: {type: string}
        subject: {type: string, nullable: true}
        client_id: {type: integer, nullable: true}
        client_name: {type: string, nullable: true}
        status: {type: string}
        created_at: {type: string}
        ticket_id: {type: integer, nullable: true}
        ticket_label: {type: string, nullable: true}
    AlertActionRequest:
      type: object
      required: [source, id, action]
      properties:
        source: {type: string, enum: [rmm, backup]}
        id: {type: integer}
        action: {type: string, enum: [acknowledge, resolve]}
    AgentConfig:
      type: object
      properties:
        checks:
          type: array
          items:
            type: object
            properties:
              key: {type: string}
              type: {type: string, enum: [service, disk, pending_reboot, script]}
              params: {type: object}
              interval_s: {type: integer}
              signature: {type: string, description: Ed25519 over the canonical JSON of the other fields}
        collect_interval_s: {type: integer}
    AgentEnrollRequest:
      type: object
      required: [enrollment_token, device]
      properties:
        enrollment_token: {type: string}
        device:
          type: object
          required: [install_id, hostname, os, os_version, arch, agent_version]
          properties:
            install_id: {type: string, format: uuid}
            machine_guid: {type: string, nullable: true}
            hostname: {type: string}
            os: {type: string, enum: [windows]}
            os_version: {type: string}
            arch: {type: string, enum: [amd64, arm64]}
            serial: {type: string, nullable: true}
            manufacturer: {type: string, nullable: true}
            model: {type: string, nullable: true}
            mac_addresses: {type: array, items: {type: string}}
            agent_version: {type: string}
    AgentEnrollResponse:
      type: object
      properties:
        device_id: {type: integer}
        device_token: {type: string, description: Shown once}
        check_in_interval_s: {type: integer}
        server_time: {type: string, format: date-time}
        status: {type: string, enum: [linked, pending_approval, ambiguous]}
        matched_asset_id: {type: integer, nullable: true}
        signing_public_key: {type: string, description: base64 Ed25519 public key}
        signing_key_id: {type: string}
        config: {$ref: '#/components/schemas/AgentConfig'}
    AgentCheckinRequest:
      type: object
      required: [seq, collected_at, agent_version]
      properties:
        seq: {type: integer, minimum: 0}
        collected_at: {type: string, format: date-time}
        agent_version: {type: string}
        inventory: {type: object, nullable: true}
        metrics:
          type: object
          nullable: true
          properties:
            cpu_pct: {type: number, nullable: true}
            mem_pct: {type: number, nullable: true}
            disk: {type: array, items: {type: object, properties: {mount: {type: string}, used_pct: {type: number, nullable: true}}}}
            net_rx_bps: {type: number, nullable: true}
            net_tx_bps: {type: number, nullable: true}
        checks:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              key: {type: string}
              status: {type: string, enum: [ok, warn, fail, unknown]}
              detail: {type: string}
        buffered:
          type: array
          maxItems: 100
          items: {type: object}
        update_result: {type: object, nullable: true}
    AgentCheckinResponse:
      type: object
      properties:
        ok: {type: boolean}
        next_check_in_s: {type: integer}
        jobs_pending: {type: integer}
        config: {$ref: '#/components/schemas/AgentConfig'}
        update:
          nullable: true
          type: object
          properties:
            version: {type: string}
            url: {type: string}
            sha256: {type: string}
            signature: {type: string, description: base64 Ed25519 over the lowercase hex sha256}
            min_version: {type: string}
        server_time: {type: string, format: date-time}
        signing_key_id: {type: string}
    AgentJob:
      type: object
      properties:
        job_id: {type: string, format: uuid}
        attempt: {type: integer}
        type: {type: string, enum: [powershell, reboot, collect]}
        script: {type: string, nullable: true}
        params: {type: object}
        timeout_s: {type: integer}
        max_output_bytes: {type: integer}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        signature: {type: string, description: base64 Ed25519 over the canonical JSON of all other fields}
    AgentJobReport:
      type: object
      required: [job_id, attempt, state]
      properties:
        job_id: {type: string, format: uuid}
        attempt: {type: integer}
        state: {type: string, enum: [running, succeeded, failed, timed_out, cancelled]}
        exit_code: {type: integer, nullable: true}
        output: {type: string}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
    AgentError:
      type: object
      required: [error, code]
      properties:
        error: {type: string}
        code: {type: string, description: "invalid_token, revoked, expired, forbidden, conflict, invalid, rate_limited, too_large, not_found, tls_required, internal"}
    EndpointDevice:
      type: object
      properties:
        device_id: {type: integer}
        hostname: {type: string}
        asset_id: {type: integer, nullable: true}
        client_id: {type: integer}
        link_state: {type: string, enum: [linked, pending_approval, rejected]}
        status: {type: string, enum: [online, offline, stale, never]}
        last_checkin_at: {type: string, format: date-time, nullable: true}
        offline_since: {type: string, format: date-time, nullable: true}
        agent_version: {type: string}
        ring: {type: string}
        inventory: {type: object, nullable: true}
        checks: {type: array, items: {type: object}}
        jobs: {type: array, items: {type: object}}
    EndpointJobRequest:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [powershell, reboot, collect]}
        script: {type: string}
        script_id: {type: integer, description: A saved PowerShell script from the RMM script library}
        params: {type: object, description: "Scalar values only (strings, whole numbers, booleans)"}
        timeout_s: {type: integer}
        destructive: {type: boolean}
        confirm: {type: boolean, description: Required for reboot and destructive jobs}

