# RivetMSP — Docker Compose nginx vhost.
#
# Plain HTTP only, on purpose: this container does not terminate TLS. Put it
# behind your own reverse proxy (Traefik, Caddy, nginx-proxy, a cloud LB —
# anything that speaks HTTP to this container's published port and HTTPS to
# the internet) for anything beyond local evaluation. See
# deploy/templates/nginx-vhost.conf.template for the bare-metal installer's
# direct-TLS/proxy-mode vhost if you want this box to terminate TLS itself
# instead.
#
# The location blocks below are the same rules as
# deploy/templates/itflow-locations.conf, duplicated rather than shared via
# `include` because this container's php-fpm listens on a plain TCP socket
# (127.0.0.1:9000, the official php image's own default) instead of the
# unix socket path the bare-metal snippet hardcodes. Kept in sync by hand;
# if you change one, check the other.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html;
    index index.php index.html;
    client_max_body_size 500M;

    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location ~ ^/(\.git|\.github|config\.php) {
        return 404;
    }

    location ^~ /uploads/ {
        location ~ ^/uploads/.*\.(php|phtml|phar|phps|cgi|pl|sh)$ {
            deny all;
        }
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(cron|scripts)/.*\.php$ {
        deny all;
    }

    location ^~ /backups/ {
        deny all;
    }

    location ^~ /config/ {
        deny all;
    }

    location ^~ /plugins/TCPDF/tools/ {
        deny all;
    }

    location ~ ^/api/v1/.+/.+\.php$ { deny all; return 403; }

    location /api/v1/ {
        try_files $uri /api/v1/index.php?$query_string;
    }

    location /api/v2/ {
        try_files $uri /api/v2/index.php?$query_string;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ ^/(login|setup)\.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
    }

    location ~ /sse_ticket_stream\.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
    }

    location = /api/v1/index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
    }

    location ^~ /plugins/ {
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 300s;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /css/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /js/ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
