; Matches client_max_body_size 500M in deploy/templates/nginx-vhost.conf.template
upload_max_filesize = 500M
post_max_size = 500M

; Upstream default (php.ini-production) ships this as 0. A `git pull` inside
; this container has nothing else that reloads php-fpm, so opcache must
; notice changed file mtimes itself rather than serving stale bytecode
; until the container restarts.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; MSP-DS-96: the image installs no php.ini, so PHP's built-in defaults (display_errors on, expose_php on) would print file paths and stack
; traces to anonymous requests. Match the bare-metal deploy/templates/php-hardening.ini and php.ini-production.
display_errors = Off
display_startup_errors = Off
expose_php = Off
log_errors = On
