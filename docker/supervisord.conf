# RivetMSP — Docker Compose process supervisor.
#
# Four long-running things in one container: php-fpm, nginx, redis, and a
# cron stand-in. A real cron daemon inside a container is more fragile than
# it's worth here (PID 1/signal handling, logging to a syslog that doesn't
# exist) — deploy/install.sh's system cron entry runs cron/cron.php every 5
# minutes as www-data, so a plain sleep-loop program reproduces that
# exactly with far less moving parts. Like the bare-metal cron entry, this
# is inert until "Enable Cron" is turned on in the app's own Settings.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:redis]
; includes/redis_functions.php hardcodes REDIS_HOST=127.0.0.1/REDIS_PORT=6380
; (chosen there to avoid colliding with an unrelated stack's default 6379 on
; the bare-metal host) and degrades gracefully if nothing answers —
; ticket/chat updates just stop live-pushing rather than the app breaking.
; Running it in this same container keeps that assumption true without
; touching the app code; --daemonize no is required under supervisord,
; which expects the process it manages to stay in the foreground.
command=redis-server --port 6380 --bind 127.0.0.1 --daemonize no --save ""
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=docker-php-entrypoint php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
command=/bin/sh -c "while true; do su -s /bin/sh www-data -c 'php /var/www/html/cron/cron.php' >> /dev/stdout 2>&1; sleep 300; done"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; cron/cron.php does not run the mail scripts; they are separate jobs (deploy/install.sh schedules both every minute). Each checks its own
; feature setting and stays idle until enabled in the app.
[program:mail_queue]
command=/bin/sh -c "while true; do su -s /bin/sh www-data -c 'php /var/www/html/cron/mail_queue.php' >> /dev/stdout 2>&1; sleep 60; done"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ticket_email_parser]
command=/bin/sh -c "while true; do su -s /bin/sh www-data -c 'php /var/www/html/cron/ticket_email_parser.php' >> /dev/stdout 2>&1; sleep 60; done"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
